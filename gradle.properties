# =====================================================================
# gradle.properties
# Opciones generales para Gradle y para el plugin de Android.
# =====================================================================

# Memoria máxima que puede usar Gradle al compilar.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Usar las librerías modernas de AndroidX.
android.useAndroidX=true

# Cada módulo solo ve sus propios recursos R (compila más rápido).
android.nonTransitiveRClass=true

# Estilo oficial de código Kotlin.
kotlin.code.style=official
