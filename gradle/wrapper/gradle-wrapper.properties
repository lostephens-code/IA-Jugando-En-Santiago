# =====================================================================
# gradle-wrapper.properties
# ---------------------------------------------------------------------
# Indica qué versión de Gradle usa el proyecto y DE DÓNDE obtenerla.
#
# distributionUrl apunta a un archivo .zip que está en ESTA MISMA carpeta
# (gradle/wrapper/gradle-8.14.3-bin.zip). Una ruta relativa se resuelve
# desde la ubicación de este archivo, así que Gradle NO se descarga de
# Internet.
#
# distributionBase=PROJECT hace que Gradle quede INSTALADO dentro del
# propio proyecto, en la carpeta gradle/dists/ (y no en la carpeta del
# usuario). Así la app y su Gradle viajan juntos.
# =====================================================================
distributionBase=PROJECT
distributionPath=gradle/dists
distributionUrl=gradle-8.14.3-bin.zip
networkTimeout=10000
zipStoreBase=PROJECT
zipStorePath=gradle/dists
